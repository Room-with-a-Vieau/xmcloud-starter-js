  - Version: 3
    Fields:
    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: "<p>Apple has officially announced the all-new MacBook Pro with PROLED XDR display, its first touchscreen laptop.</p><h2>MacBook Pro details</h2><p>The new machine features a light-up Apple logo, tandem OLED, and touch input on the display. It runs on the M5 Pro and M5 Max chips, like the existing MacBook Pro models without OLED touch displays.</p><p>Apple CEO John Ternus shared an early look at the new machine following the company’s October 19 “Pro and tell” experience teaser and a new “spotlight” teaser.</p><p>Apple previously used a glowing Apple logo on its notebook hardware for years, until the 12-inch MacBook and 2016 MacBook Pro.</p><h2>Pricing and availability</h2><p>Pricing starts at $2,899 for the 14-inch model. The 16-inch version starts at $3,399.</p><p>Pre-orders are available starting today, with deliveries beginning November 6. The new machines are also available on Amazon.</p>"
