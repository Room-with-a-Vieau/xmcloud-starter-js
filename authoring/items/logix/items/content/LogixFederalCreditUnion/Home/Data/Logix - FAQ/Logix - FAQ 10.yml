    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: <p>A membership share account is the basic savings account at a credit union that is the ownership stake for every member. This savings account, which must contain a minimum of $5, guarantees members the voting rights and other benefits of credit union membership.</p>
