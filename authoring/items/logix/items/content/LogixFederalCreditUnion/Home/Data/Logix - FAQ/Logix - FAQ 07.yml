    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: |
        <p>Your deposits in a credit union are federally insured by the National Credit Union Share Insurance Fund, an arm of the <a href="https://ncua.gov/" title="National Credit Union Administration" target="_blank">NCUA</a>. This insurance is similar to coverage offered by the <a href="https://www.fdic.gov/" title="Federal Deposit Insurance Corporation" target="_blank">FDIC</a>, and both are backed by the full faith and credit of the United States government.<br></p> <ul> <li>Your combined savings, money market, and checking balances are insured up to $250,000.</li> <li>Your combined IRA balances are insured separately up to an additional $250,000.<br></li> </ul> <p>You may obtain additional coverage on multiple accounts you have with Logix if you have different ownership interests or rights (and you properly complete account forms and applications).</p>
