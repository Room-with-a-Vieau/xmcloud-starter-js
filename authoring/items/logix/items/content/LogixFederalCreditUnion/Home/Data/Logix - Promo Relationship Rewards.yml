    - ID: "cc0cb595-ce5c-413e-b413-3a7176347f28"
      Hint: Text
      Value: "<p>The Logix Relationship Rewards Program gives you access to valuable perks and exclusive savings, just for being a member.</p><p><strong>Here's how it works:</strong> With your Logix Checking or Money Market Account and a combined household balance between $35,000 and $99,999, you'll automatically qualify for our Gold Tier Relationship Rewards.*</p><p><strong>As a Gold Tier Relationship Rewards Member, you'll enjoy:</strong></p><ul><li>0.10% Auto Loan Interest Rate Discount</li><li>$500 Mortgage Loan Fee Discount</li><li>2 Rewards Points for Each $1 Spent on Eligible Purchases Using Our World Rewards Mastercard®</li></ul><p><small>*Combined household balance includes any loan, mortgage, checking, money market and savings balances (excluding certificates) at Logix.</small></p>"
