    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: "<p>Yes! While non-profits are usually found in the IRS tax code 501(c)3, state-chartered credit unions are 501(c)14, and federal credit unions, like Logix, are 501(c)1. Find out more on the IRS website.</p>"
