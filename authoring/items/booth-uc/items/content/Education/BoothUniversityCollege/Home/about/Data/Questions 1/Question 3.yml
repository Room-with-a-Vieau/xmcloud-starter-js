    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: "Comment puis-je me protéger contre le vol d'identité et la fraude en ligne ?"
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: La protection de vos informations financières est une priorité pour nous. Nous utilisons des mesures de sécurité de pointe pour protéger vos données et prévenir les accès non autorisés. De plus, nous offrons des conseils et des astuces pour reconnaître et éviter les escroqueries courantes et les tentatives de phishing. Notre plateforme de banque en ligne est équipée de technologies de cryptage pour garantir que vos transactions sont sécurisées en tout temps.
