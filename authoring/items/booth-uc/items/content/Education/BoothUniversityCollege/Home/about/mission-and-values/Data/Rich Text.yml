      Hint: Text
      Value: <h2>Our mission</h2><p>Booth University College is a Christian university college rooted in The Salvation Army's commitment to the gospel and to social justice. We educate students to think critically, act compassionately, and serve faithfully.</p><h2>Our values</h2><p>We value academic excellence, the dignity of every person, hospitality, integrity, and a practical faith that responds to human need. These values shape our classrooms, our research, and our community life.</p>
