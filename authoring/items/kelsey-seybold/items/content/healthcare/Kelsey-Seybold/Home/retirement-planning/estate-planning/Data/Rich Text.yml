        <h2>Who is eligible for Medicare Advantage</h2>
        <p>You can generally join a Medicare Advantage plan if you are enrolled in Medicare Parts A and B and live in the plan's service area. Most people become eligible for Medicare at age 65, and some qualify earlier because of a disability or certain medical conditions.</p>
        <p>When you join a Medicare Advantage plan, you continue to pay your Part B premium, and the plan provides your hospital and medical coverage in place of Original Medicare.</p>
        <h2>Key enrollment periods</h2>
        <p><strong>Initial Enrollment Period:</strong> the seven-month window that begins three months before the month you turn 65 and ends three months after it.</p>
        <p><strong>Annual Enrollment Period:</strong> October 15 through December 7 each year, when you can join, switch or drop a plan for coverage starting January 1.</p>
        <p><strong>Medicare Advantage Open Enrollment:</strong> January 1 through March 31, when people already in a Medicare Advantage plan can switch to another plan or return to Original Medicare.</p>
        <p><strong>Special Enrollment Periods:</strong> available if you move, lose other coverage or have another qualifying life event.</p>
        <p>Make a list of your doctors and prescriptions before you compare plans, and confirm that Kelsey-Seybold is in the plan's network. Our Medicare specialists are happy to help.</p>
