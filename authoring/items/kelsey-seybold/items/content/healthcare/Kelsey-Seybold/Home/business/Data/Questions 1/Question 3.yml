    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: "How is specialty care different from primary care?"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\andrew.vieau@sitecore.com
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261102T231141Z
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: Your primary care doctor manages your overall health, preventive care and common conditions. Specialists have advanced training in a specific area, such as the heart, joints or women's health, and work with your primary care doctor when you need focused diagnosis or treatment.
