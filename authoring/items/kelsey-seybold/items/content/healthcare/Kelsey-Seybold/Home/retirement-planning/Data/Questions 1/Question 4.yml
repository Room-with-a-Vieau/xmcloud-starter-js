    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: "Comment puis-je commencer à planifier ma retraite ?"
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: Pour démarrer votre parcours de planification de la retraite, commencez par évaluer votre situation financière actuelle et réfléchissez à vos objectifs de retraite. Ensuite, consultez l'un de nos conseillers pour créer un plan de retraite personnalisé adapté à vos besoins.
