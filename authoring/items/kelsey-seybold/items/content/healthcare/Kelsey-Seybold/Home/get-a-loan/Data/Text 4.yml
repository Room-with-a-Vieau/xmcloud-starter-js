      Hint: Text
      Value: "<h2>MyKelseyOnline Terms of Use</h2><p><strong>Not for Emergencies:</strong> MyKelseyOnline is not intended for urgent or emergency medical needs. If you are experiencing a medical emergency, call 911 or go to the nearest emergency room.</p><p><strong>Informational Purposes:</strong> Information in MyKelseyOnline, including test results and visit notes, is provided to help you take part in your care. It does not replace a conversation with your doctor. Contact your care team with any questions about your results or treatment.</p><p><strong>Privacy and Security:</strong> Your health information is protected under federal and state privacy laws. Kelsey-Seybold uses your information only as described in our Notice of Privacy Practices and will not share it with third parties without your authorization, except as permitted by law.</p><p><strong>Account Responsibility:</strong> You are responsible for keeping your username and password confidential. Proxy access for minors or adult dependents is granted according to Kelsey-Seybold policies and applicable law.</p><p><strong>Changes to the Service:</strong> We may update, suspend or discontinue features of MyKelseyOnline at any time. We may also update these terms from time to time, and continued use of the portal means you accept the updated terms.</p><p>By using MyKelseyOnline, you acknowledge that you have read, understood and agreed to these terms. If you do not agree, please contact our Contact Center for other ways to access your health information.</p><p><br /></p>"
