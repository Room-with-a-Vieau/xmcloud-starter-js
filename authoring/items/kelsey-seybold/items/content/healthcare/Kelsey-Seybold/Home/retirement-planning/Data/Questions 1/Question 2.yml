    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: "When can I enroll in a Medicare Advantage plan?"
    - ID: "badd9cf9-53e0-4d0c-bcc0-2d784c282f6a"
      Hint: __Updated by
      Value: |
        sitecore\andrew.vieau@sitecore.com
    - ID: "d9cf14b1-fa16-4ba6-9288-e8a174d4d522"
      Hint: __Updated
      Value: 20261102T231355Z
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: You can first enroll during your Initial Enrollment Period, the seven months around your 65th birthday. After that, you can change plans each year during Annual Enrollment, October 15 through December 7, or during a Special Enrollment Period if you move or have another qualifying life event.
- Language: "fr-CA"
  Versions:
