    - ID: "03117268-f84f-4fd8-ad9e-5990b3a21fe6"
      Hint: Content
      Value: "<p>Apple has announced an all-new MacBook Pro with a PROLED XDR display, marking the company’s first touchscreen laptop.</p><p>The new machine was first hinted at on October 19 through Apple’s “Pro and tell” experience teaser. Earlier today, Apple CEO John Ternus shared a spotlight teaser for the laptop.</p><h2>MacBook Pro details</h2><p>The new MacBook Pro features a light-up Apple logo, tandem OLED technology, and touch input on the display.</p><p>It runs on the M5 Pro and M5 Max chips, like the existing MacBook Pro models without OLED touch displays.</p><p>Apple previously used a glowing Apple logo on its notebook hardware for years, until the 12-inch MacBook and 2016 MacBook Pro.</p><h2>Pricing and availability</h2><p>Pricing starts at $2,899 for the 14-inch model. The 16-inch version starts at $3,399.</p><p>Pre-orders are available today, with deliveries beginning November 6. The new machines are also available on Amazon.</p>"
