        <h2>Appointments</h2>
        <p><strong>Q: How do I make an appointment?</strong><br />
        <strong>A:</strong> You can schedule online through MyKelseyOnline, use the Make an Appointment page on our website, or call our Contact Center at 713-442-0427. Same-day and video visits are available for many needs.</p>
        <p><strong>Q: I'm a new patient. What should I bring to my first visit?</strong><br />
        <strong>A:</strong> Bring a photo ID, your insurance card, a list of your current medications and any recent medical records. Arrive 15 minutes early, or complete check-in ahead of time in MyKelseyOnline.</p>
        <h2>Insurance and Billing</h2>
        <p><strong>Q: Which insurance plans do you accept?</strong><br />
        <strong>A:</strong> Kelsey-Seybold is in network with more than 50 health plans, including many employer, Marketplace and Medicare Advantage plans. Visit our Health Plans page or call us to confirm your coverage before your visit.</p>
        <p><strong>Q: How can I pay my bill?</strong><br />
        <strong>A:</strong> You can view and pay your bill online in MyKelseyOnline, by phone or in person at any clinic. If you have questions about a charge, our billing team is happy to help.</p>
        <h2>Prescriptions</h2>
        <p><strong>Q: How do I request a prescription refill?</strong><br />
        <strong>A:</strong> Request refills in MyKelseyOnline or contact your pharmacy, which will send the request to your doctor. Please allow two to three business days for refill requests.</p>
        <p><strong>Q: Do you have on-site pharmacies?</strong><br />
        <strong>A:</strong> Yes. Many Kelsey-Seybold locations have a pharmacy on site, so you can pick up prescriptions right after your visit.</p>
        <h2>MyKelseyOnline</h2>
        <p><strong>Q: How do I sign up for MyKelseyOnline?</strong><br />
        <strong>A:</strong> Visit mykelseyonline.com or download the MyKelseyOnline app and select Sign Up. You can also ask for an activation code at your next visit.</p>
        <p><strong>Q: Can I see my test results online?</strong><br />
        <strong>A:</strong> Yes. Most lab and imaging results are posted to MyKelseyOnline as soon as they are available, along with notes from your doctor.</p>
        <h2>Urgent Needs</h2>
        <p><strong>Q: What should I do if I need care after hours?</strong><br />
        <strong>A:</strong> Call our Contact Center to speak with a nurse, start a virtual urgent care visit or visit a same-day clinic with extended hours. For emergencies, call 911 or go to the nearest emergency room.</p>
        <p>For more information on any of these topics, visit the related sections of our website or contact our Patient Support team. We're here to help you get the care you need.</p>
