      Value: |
        <div class="ck-content"><p>Your church staff is at the heart of your ministry. They are the hands and feet that help carry out your mission. That is why it is vital to understand best practices for safely recruiting new staff members. Consider these steps to align your team and help safeguard your ministry.</p><h2>1. Develop a Clear Role Description</h2><p>Before you start recruiting new staff members, specify the roles and responsibilities of each position. Consider the following:</p><ul><li>Reporting structure</li><li>Location</li><li>Responsibilities</li><li>How responsibilities align with your mission</li><li>Church membership requirements</li><li>Prior experience</li><li>Relevant skills</li><li>References</li></ul><h2>2. Conduct Thorough Background Checks</h2><p>Choose a reputable firm to conduct background screenings on both new and current staff. It is a best practice to perform background checks on your entire team once a year to help protect your people and your ministry. The screening should cover the entire United States and be broad enough to pick up close matches, such as similarly spelled names or transposed Social Security numbers. It should include federal, state and county court records.</p><h3>Background Check Considerations</h3><ul><li>Establish reasonable care by requiring applicants to complete an application for each position.</li><li>Make screening criteria dependent on anticipated job duties; not all positions have the same needs.</li><li>Keep candidate background information confidential and provide it only to people with an operational need for it.</li></ul><h3>Fair Credit Reporting Act (FCRA) Requirements</h3><ul><li>Use a company that specializes in background checks to help ensure quality information and FCRA compliance.</li><li>Notify the candidate that a background check will be conducted and obtain written authorization.</li><li>Provide a summary of consumer rights to the applicant.</li><li>Notify the candidate in writing if they are not chosen based on eligibility for the position, including if they are not hired, demoted or transferred.</li></ul><h3>Candidate and Worker Rights</h3><p>When employers use background check information to decline employment, they must provide in writing the name, address and phone number of the agency that reported the information. Candidates and workers can request and obtain information provided to the employer. Candidates who receive written notice that they did not get a job because of negative credit history can request a free copy of their credit report within 60 days.</p><h2>3. Find the Right Candidate</h2><p>When looking for the right candidate to support your ministry, use all the resources at your disposal. In addition to background checks, references can help your hiring team gain a clearer picture of a candidate's experience, work ethic and character.</p><p>Also consider how well a candidate aligns with your church's mission. Skills and experience are important, but finding someone who shares your vision can strengthen the team in the long term.</p><h2>4. Provide Ongoing Training</h2><p>Invest in your team by onboarding staff with details about their work, the people they will serve and how their service fits within the overall mission of your church or ministry.</p><p>Make ongoing training part of your church management plan. It can reinforce existing procedures, address new concerns and help protect all people involved, especially children, youth and vulnerable adults. A training program also lends credibility to your ministry and guides workers toward a common goal.</p><h2>Reduce Risks in All Areas of Church Management</h2><p>Church hiring and recruiting is one of many administrative tasks, and each carries its own risk. Consider whether your ministry is mitigating risks related to crime, employees and conflicts of interest. You do not have to do it alone. GuideStone can help you understand property and casualty insurance and protect your ministry.</p><p><em>This article is for informational purposes only and is not intended to be construed as legal advice. Use it as a tool, along with best judgment and any applicable terms or conditions, to determine appropriate policies and procedures for your church's risk management program.</em></p></div>
