    - ID: "93ba0221-aa2a-4a04-b8f6-39c2ab65c694"
      Hint: Question
      Value: 自分が引退する準備ができているかどうかを知るには？
    - ID: "ef205dfd-6af2-4514-b694-77efa748f951"
      Hint: Answer
      Value: 引退する準備ができていないのなら、引退する必要はない。 それは個人の選択だ。 経済的な準備が整ったときに明確な決断ができるよう、退職プランを考えるお手伝いをします。
