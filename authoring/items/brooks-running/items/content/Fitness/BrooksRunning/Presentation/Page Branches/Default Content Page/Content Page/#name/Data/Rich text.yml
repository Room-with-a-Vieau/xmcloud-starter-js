    - ID: "729034fc-24f3-40b7-8fa4-fb49d7de20dd"
      Hint: Text
      Value: "<p>Brooks believes running has the power to change lives, and we want every runner to feel that, from a first mile to a hundredth marathon. We're not just a shoe company; we're a running company, focused on helping you run happy.</p><h2>Our Mission</h2><p>Inspire everyone to run and be active by building the best gear for every stride. Through biomechanics research and runner feedback, we design shoes and apparel that feel good from the first step, so you can focus on the run itself.</p><h2>Who We Are</h2><p>A team of runners, designers and scientists based in Seattle. We pair lab testing with miles on real roads and trails, and every product goes through both before it reaches you.</p><h2>What Sets Us Apart</h2><p>No two runners are the same. That's why we offer cushioned, supportive and fast options for road, trail and track, plus apparel for every season. Whether you're training for a 5K, chasing a PR or getting back out after time off, there's a fit for you.</p><h2>Our Commitment to You</h2><p>Runners come first. We stand behind our gear with a 90-day trial and back it with fit guidance, training content and a community that shows up for each other on every run.</p>"
