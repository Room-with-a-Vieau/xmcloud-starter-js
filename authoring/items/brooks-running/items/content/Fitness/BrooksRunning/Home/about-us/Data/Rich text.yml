    - ID: "729034fc-24f3-40b7-8fa4-fb49d7de20dd"
      Hint: Text
      Value: "<h2>We believe in the power of the run</h2><p>At Brooks, running is more than a sport. It is a way to feel good, clear your head and connect with others. That is why we focus on one thing: making the best running gear in the world.</p><h3>Science behind every stride</h3><p>Our biomechanics lab studies how runners move so we can design shoes that work with your body, not against it.</p><h3>Built for every runner</h3><p>From first-time joggers to marathon champions, we make shoes and apparel for every pace, distance and body.</p><h3>Running toward a better future</h3><p>We are committed to reducing our environmental footprint and supporting the communities where we run.</p>"
