      Hint: Text
      Value: |
        <div class="ck-content"><p>Corre a tu manera, en cada kilómetro. En Brooks, creemos que correr te pertenece, ya sea un 5K al amanecer, una vuelta a la hora de la comida o esa carrera larga para la que te has estado preparando toda la temporada. Por eso diseñamos zapatos, ropa y bras deportivos pensando en cómo se mueve tu cuerpo, para que cada paso se sienta natural, con soporte y un poco más divertido. Encuentra tu ajuste, equípate y sal ahí fuera. Run Happy.</p></div>
