      Hint: Text
      Value: |
        <div class="ck-content"><p>Run your way, every mile. At Brooks, we believe the run belongs to you, whether it’s a sunrise 5K, a lunchtime loop or the long one you’ve been building toward all season. That’s why we design shoes, apparel and sports bras around how your body moves, so every step feels natural, supported and a little more fun. Find your fit, gear up and get out there. Run Happy.</p></div>
