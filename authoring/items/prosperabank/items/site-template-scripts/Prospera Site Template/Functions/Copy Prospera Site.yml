---
ID: "d7379a2f-3837-40bc-932f-01b5fb207909"
Parent: "0b829587-39aa-4574-a86c-3c32f3294a25"
Template: "dd22f1b3-bd87-4db2-9e7d-f7a496888d43"
Path: "/sitecore/system/Modules/PowerShell/Script Library/Prospera Site Template/Functions/Copy Prospera Site"
SharedFields:
- ID: "b1a94ff0-6897-47c0-9c51-aa6acb80b1f0"
  Hint: Script
  Value: |
    # Post setup step for the "Prospera Bank" site template.
    # SXA has already scaffolded an empty headless site. This replaces its Home, Data,
    # Presentation and Dictionary with copies of Prospera's, then repoints every ID and
    # path reference in the new site from Prospera (or the discarded scaffolding) to the copies.
    function Invoke-Step {
        [CmdletBinding()]
        param(
            [Parameter(Mandatory = $true, Position = 0)]
            [Sitecore.XA.JSS.Foundation.Scaffolding.Models.CreateNewJSSSiteModel]$Model
        )
    
        begin {
            Write-Log "Cmdlet Copy Prospera Site - Begin" -Log "INFO"
        }
    
        process {
            # /sitecore/content/Financial/ProsperaFinancial
            $sourceSiteId = "{08D9417D-5071-46FF-896B-EB76B0790526}"
            $copiedChildren = @("Home", "Data", "Presentation", "Dictionary")
    
            [Item]$SiteLocation = $Model.SiteLocation
            $sitePath = "$($SiteLocation.Paths.Path)/$($Model.SiteName)"
            $site = Get-Item -Path "master:$sitePath"
            $source = Get-Item -Path "master:" -ID $sourceSiteId -ErrorAction SilentlyContinue
            if ($source -eq $null) {
                Write-Log "Prospera site $sourceSiteId not found, leaving $sitePath as scaffolded" -Log "WARN"
                return
            }
            $sourcePath = $source.Paths.Path
    
            # Old ID as 32 upper-case hex chars -> new System.Guid
            $idMap = @{}
    
            function Add-IdMapping($oldId, $newId) {
                $idMap[$oldId.Guid.ToString("N").ToUpper()] = $newId.Guid
            }
    
            # Relative path under $Root -> item ID (first item wins on duplicate names)
            function Get-RelativePathMap([Item]$Root) {
                $map = @{}
                $rootLength = $Root.Paths.Path.Length
                foreach ($descendant in @($Root) + @($Root.Axes.GetDescendants())) {
                    $relativePath = $descendant.Paths.Path.Substring($rootLength)
                    if (-not $map.ContainsKey($relativePath)) { $map[$relativePath] = $descendant.ID }
                }
                $map
            }
    
            function Copy-ItemTree([Item]$Item, [Item]$Destination) {
                $copy = $Item.CopyTo($Destination, $Item.Name, [Sitecore.Data.ID]::NewID, $false)
                Add-IdMapping $Item.ID $copy.ID
                foreach ($child in $Item.Children) { Copy-ItemTree $child $copy | Out-Null }
                $copy
            }
    
            function Get-TopSegment([string]$RelativePath) {
                if ($RelativePath -eq "") { return "" }
                $RelativePath.Split("/")[1]
            }
    
            $sourceMap = Get-RelativePathMap $source
            $scaffoldedMap = Get-RelativePathMap $site
    
            Write-Log "Copying $($copiedChildren -join ', ') from $sourcePath to $sitePath" -Log "INFO"
            foreach ($name in $copiedChildren) {
                $sourceChild = $source.Children[$name]
                if ($sourceChild -eq $null) { continue }
                $scaffolded = $site.Children[$name]
                if ($scaffolded -ne $null) { $scaffolded.Recycle() | Out-Null }
                Copy-ItemTree $sourceChild $site | Out-Null
            }
            $site = Get-Item -Path "master:$sitePath"
            $copiedMap = Get-RelativePathMap $site
    
            # Discarded scaffolding -> copy at the same relative path
            foreach ($relativePath in $scaffoldedMap.Keys) {
                if ($copiedChildren -contains (Get-TopSegment $relativePath) -and $copiedMap.ContainsKey($relativePath)) {
                    Add-IdMapping $scaffoldedMap[$relativePath] $copiedMap[$relativePath]
                }
            }
            # Prospera items that were not copied (site root, Settings, Media) -> the new site's own
            foreach ($relativePath in $sourceMap.Keys) {
                if ($copiedChildren -notcontains (Get-TopSegment $relativePath) -and $scaffoldedMap.ContainsKey($relativePath)) {
                    Add-IdMapping $sourceMap[$relativePath] $scaffoldedMap[$relativePath]
                }
            }
    
            # Matches {D}, %7BD%7D and bare D-format GUIDs, plus N-format (e.g. _id=... in rich text, StartItem)
            $guidPattern = '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}|(?<![0-9A-Fa-f])[0-9A-Fa-f]{32}(?![0-9A-Fa-f])'
            $pathPattern = [regex]::Escape($sourcePath) + '(?![\w-])'
            $evaluator = [System.Text.RegularExpressions.MatchEvaluator]{
                param($match)
                $key = $match.Value.Replace("-", "").ToUpper()
                if (-not $idMap.ContainsKey($key)) { return $match.Value }
                $format = if ($match.Value.Contains("-")) { "D" } else { "N" }
                $newValue = $idMap[$key].ToString($format)
                if ($match.Value -cmatch '[A-F]') { $newValue.ToUpper() } else { $newValue }
            }.GetNewClosure()
    
            Write-Log "Rewriting references to $($idMap.Count) items" -Log "INFO"
            $versions = @(Get-Item -Path "master:$sitePath" -Language * -Version *) + @(Get-ChildItem -Path "master:$sitePath" -Recurse -Language * -Version *)
            foreach ($version in $versions) {
                $version.Fields.ReadAll()
                $changes = @{}
                foreach ($field in $version.Fields) {
                    # Raw value only: no standard values, and the stored delta for __Final Renderings
                    $raw = $field.GetValue($false, $false)
                    if ([string]::IsNullOrEmpty($raw)) { continue }
                    $value = [regex]::Replace($raw, $guidPattern, $evaluator)
                    $value = [regex]::Replace($value, $pathPattern, $sitePath, [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
                    if ($value -cne $raw) { $changes[$field.ID] = $value }
                }
                if ($changes.Count -gt 0) {
                    $version.Editing.BeginEdit()
                    foreach ($fieldId in $changes.Keys) { $version.Fields[$fieldId].Value = $changes[$fieldId] }
                    $version.Editing.EndEdit() | Out-Null
                }
            }
    
            # Render on Prospera's editing host and start at the copied Home
            $sourceGrouping = Get-ChildItem -Path "master:$sourcePath/Settings/Site Grouping" | Select-Object -First 1
            $siteGrouping = Get-ChildItem -Path "master:$sitePath/Settings/Site Grouping" | Select-Object -First 1
            $homeItem = Get-Item -Path "master:$sitePath/Home"
            if ($siteGrouping -ne $null) {
                $siteGrouping.Editing.BeginEdit()
                if ($sourceGrouping -ne $null) { $siteGrouping["RenderingHost"] = $sourceGrouping["RenderingHost"] }
                $siteGrouping["StartItem"] = $homeItem.ID.ToString()
                $siteGrouping.Editing.EndEdit() | Out-Null
            }
        }
    
        end {
            Write-Log "Cmdlet Copy Prospera Site - End" -Log "INFO"
        }
    }
