# Client Brand Theme
# Generated by the theme extraction skill from a client website.

client:
  name: "Logix Federal Credit Union"
  sourceUrl: "https://www.logixbanking.com/"
  extractedAt: "2026-10-09T16:55:00Z"
  extractedBy: "Claude Code (sitecore-extract-theme, Playwright + screenshot)"

colors:
  primary: "#2d789d"            # filled CTA buttons (Learn More, View Rates, Login), outline-button text, links
  primaryForeground: "#ffffff"
  secondary: "#ef5418"          # main nav bar, icons, card gradient bottoms, "Become a Logix Member" footer CTA
  secondaryForeground: "#ffffff"
  accent: "#ef5418"             # logo orange (#eb5527 in SVG), quote marks, bullet markers, checkmarks
  accentForeground: "#ffffff"
  background: "#ffffff"
  foreground: "#2b353e"         # computed body/heading text (dark slate)
  muted: "#f9f9f9"              # light gray bands (Why Members Choose Logix, Questions, FAQ, footer)
  mutedForeground: "#2b353e"
  headerBackground: "#ffffff"   # white utility/logo row; orange nav bar below it
  headerForeground: "#2d789d"   # utility links (Open Account, Branches & ATMs, Rates…)
  footerBackground: "#f9f9f9"
  footerForeground: "#2d789d"   # footer link columns; bottom legal bar is #525354 with white text
  border: "#e0e0e0"
  ring: "#2d789d"
  extra:
    - { name: "navBar", value: "#ef5418", note: "full-width orange category nav under the logo row" }
    - { name: "cardGradientTop", value: "#f9c9b5", note: "peach top of the orange icon-card gradient" }
    - { name: "joinBand", value: "#e6f1f5", note: "pale blue gradient band behind 'Want to Join the Logix Community?'" }
    - { name: "legalBar", value: "#525354", note: "dark gray bottom footer bar" }
    - { name: "logoSlate", value: "#5b6670", note: "'Logix' wordmark gray" }

typography:
  headingFamily: "Roboto"
  headingWeight: "500-700"
  bodyFamily: "Roboto"
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
  scale:
    hero: "~40px bold, white on dark translucent panel"
    h1: "40px / 700"
    h2: "28-32px / 500 (section titles, sentence case)"
    h3: "20px / 500 (card titles)"
    body: "16px / 24px"
    small: "14px (eyebrows, card meta)"
  headingTransform: "none (title case)"
  letterSpacing: "normal"
  lineHeight: "1.5"

spacing:
  density: "spacious"
  sectionGap: "~96-120px"
  containerMaxWidth: "~1140px"
  containerPadding: "~24px"

shape:
  borderRadius: "8px"
  buttonRadius: "4px"           # filled teal buttons; outline variant uses 1px teal border
  cardRadius: "16px"
  imageRadius: "8px"
  shadowStyle: "subtle"         # rgba(62,62,62,0.08) 0 4px 32px
  borderStyle: "none"

tone:
  overall: "friendly, trustworthy, community-focused credit union"
  colorMode: "light"
  contrast: "medium"
  imagery: "lifestyle photography + flat two-tone orange icons + robot mascot illustration"
  heroStyle: "full-bleed photo with headline on a dark translucent panel, login card overlaid right"
  cardStyle: "elevated white cards, orange gradient icon tile on top, teal button below"
  navStyle: "white utility/logo row with search, then solid orange category bar"

tailwind:
  colors:
    brand:
      primary: "#2d789d"
      secondary: "#ef5418"
      accent: "#ef5418"
  fontFamily:
    heading: ["Roboto", "Helvetica", "Arial", "sans-serif"]
    body: ["Roboto", "Helvetica", "Arial", "sans-serif"]
  borderRadius:
    DEFAULT: "0.5rem"
    button: "0.25rem"
    card: "1rem"

cssVariables: |
  --brand-primary: #2d789d;
  --brand-primary-foreground: #ffffff;
  --brand-secondary: #ef5418;
  --brand-secondary-foreground: #ffffff;
  --brand-accent: #ef5418;
  --brand-accent-foreground: #ffffff;
  --brand-bg: #ffffff;
  --brand-fg: #2b353e;
  --brand-muted: #f9f9f9;
  --brand-muted-fg: #2b353e;
  --brand-header-bg: #ffffff;
  --brand-header-fg: #2d789d;
  --brand-footer-bg: #f9f9f9;
  --brand-footer-fg: #2d789d;
  --brand-border: #e0e0e0;
  --brand-ring: #2d789d;
  --brand-heading-font: 'Roboto', sans-serif;
  --brand-body-font: 'Roboto', sans-serif;
  --brand-radius: 0.5rem;
  --brand-button-radius: 0.25rem;
  --brand-card-radius: 1rem;

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "Scraper succeeded (computed styles, meta, logo.svg). Colors confirmed by pixel samples from the user-supplied screenshot."
    - "Computed 'primary button' reported white bg / #00789d text (it hit an outline button); filled CTAs sample as #2d789d, used as primary."
    - "Site :root vars (--primary #007bff, --secondary #6c757d) are Bootstrap defaults, not brand tokens — ignored."
    - "Roboto is the live site font and is on Google Fonts — no substitution."
    - "Orange is used for nav/icons/accents, not for most buttons; only the footer 'Become a Logix Member' CTA is filled orange."
