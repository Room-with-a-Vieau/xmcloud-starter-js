extraction:
  confidence: "medium"
  method: "screenshot (pixel-sampled colors); Playwright scraper and plain HTTP both blocked"
  notes:
    - "brooksrunning.com returns 'Access Denied' / HTTP 403 to headless and scripted requests (bot protection), so no CSS tokens, fonts, or images were extracted."
