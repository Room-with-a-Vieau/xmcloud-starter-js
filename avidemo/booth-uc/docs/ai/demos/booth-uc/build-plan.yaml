    - componentName: "Five Column CTA"
      instanceId: "b882746c-c313-4283-8f58-b9402bcf9c6a"
      forSection: 6
  notInPlan:   # remove in Pages (or via remove_component_on_page with SE approval)
    - { componentName: "Carousel", instanceId: "124106de-fb02-4b43-a521-a309fc75a5bc" }
    - { componentName: "Promo CTA", instanceId: "d49a8931-f041-4988-9cc3-f2400e6422d0" }
    - { componentName: "Three Column CTA", instanceId: "d54d53b4-1aa4-4998-9bdf-eb934c32cfb6" }
    - { componentName: "Promo CTA", instanceId: "633506e7-54d0-4410-9051-72fb4c9fecb4" }
