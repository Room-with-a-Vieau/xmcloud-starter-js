  sectionGap: "6rem"
  containerMaxWidth: "1200px"
  containerPadding: "1.5rem"

shape:
  borderRadius: "0"
  buttonRadius: "9999px"        # outlined pill buttons ("Why Booth UC?", "View All Events")
  cardRadius: "0"
  imageRadius: "5px"
  shadowStyle: "none"
  borderStyle: "2px solid navy outline on buttons; thin vertical rule beside link lists"

tone:
  overall: "editorial"          # traditional academic, serif headlines, faith-based institution
  colorMode: "light"            # with a navy hero/footer and a red news band
  contrast: "high"
  imagery: "photography"        # students on campus; navy duotone overlays on hero and school tiles
  heroStyle: "full-bleed-image" # navy-tinted photo, large serif headline, search bar, wave divider
  cardStyle: "flat"             # square image tiles with uppercase caption overlay
  navStyle: "transparent-overlay"

tailwind:
  colors:
    brand:
      primary: "#031d33"
      secondary: "#00447c"
      accent: "#b5121b"
  fontFamily:
    heading: ["Crimson Pro", "Georgia", "serif"]
    body: ["Helvetica Neue", "Helvetica", "Arial", "sans-serif"]
  borderRadius:
    DEFAULT: "0"
    button: "9999px"
    card: "0"

cssVariables: |
  :root {
    --brand-primary: #031d33;
    --brand-primary-foreground: #ffffff;
    --brand-secondary: #00447c;
    --brand-secondary-foreground: #ffffff;
    --brand-accent: #b5121b;
    --brand-accent-foreground: #ffffff;
    --brand-bg: #ffffff;
    --brand-fg: #031d33;
    --brand-muted: #f0f0f0;
    --brand-muted-fg: #031d33;
    --brand-header-bg: transparent;
    --brand-header-fg: #ffffff;
    --brand-footer-bg: #031d33;
    --brand-footer-fg: #ffffff;
    --brand-border: #d2d2d2;
    --brand-ring: #00447c;
    --brand-heading-font: 'Crimson Pro', Georgia, serif;
    --brand-body-font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --brand-radius: 0;
    --brand-button-radius: 9999px;
    --brand-card-radius: 0;
  }

extraction:
  confidence: "high"
  method: "playwright-full"
  notes:
    - "No CSS custom properties; hex values taken from the site's TMv_BoothUC_Theme.css by frequency (#031d33 x27, #b5121b x6, #e7a614 x4, #00447c x2)."
    - "Headings use Crimson Pro (self-hosted, also on Google Fonts — same font, no substitution)."
    - "Body uses 'Helvetica Neue BUC' (self-hosted licensed Helvetica Neue). Demo uses the system Helvetica Neue / Helvetica / Arial stack; no Google font needed."
    - "Prospera exposes a single --font-family token; using Crimson Pro for headings needs a heading-font rule in Phase 4 (otherwise the whole site goes serif or sans)."
    - "Scraped primaryButtonBackground (white) is the transparent hero link, not a real button; actual buttons are navy-outlined pills."
    - "Crest tricolour (red #b5121b / gold #e7a614 / blue #00447c) appears in the stat badges; useful for accent bands."
