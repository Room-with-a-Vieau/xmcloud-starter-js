  extractedAt: "2026-10-02T22:52:00Z"
  extractedBy: "site-scraper.mjs + screenshot sampling"

colors:
  primary: "#FD1434"            # Cooley crimson — headlines, buttons, footer band
  primaryForeground: "#33040E"  # site uses burgundy text on crimson
  secondary: "#33040E"          # deep burgundy — body text, dark resource card
  secondaryForeground: "#FD1434"
  accent: "#FD1434"
  accentForeground: "#33040E"
  background: "#FFFFFF"
  foreground: "#33040E"
  muted: "#FFF2F4"              # blush card background
  mutedForeground: "#33040E"
  headerBackground: "#FFFFFF"   # transparent over white
  headerForeground: "#FD1434"
  footerBackground: "#FD1434"
  footerForeground: "#33040E"
  border: "#FD1434"             # thin crimson rules (search underline, eyebrow bars)
  ring: "#FD1434"
  extra:
    - { name: "lavender", value: "#E6EAFF", use: "featured news panel in hero" }
    - { name: "blush", value: "#FFF2F4", use: "light resource card" }

typography:
  headingFamily: "Newsreader"   # substitute for GT Sectra (proprietary)
  headingWeight: "300"
  bodyFamily: "Arimo"           # substitute for Arial Nova (proprietary)
  bodyWeight: "400"
  monoFamily: ""
  googleFontsUrl: "https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
  scale:
    hero: "98px"
    h1: "98px"
    h2: "16px"                  # uppercase-style section labels in sans bold
    h3: "60px"
    body: "16px"
    small: "13px"
  headingTransform: "none"
  letterSpacing: "-0.01em"
  lineHeight: "1.15"

spacing:
  density: "airy"
  sectionGap: "96px"
  containerMaxWidth: "100%"
  containerPadding: "32px"

shape:
  borderRadius: "0px"
  buttonRadius: "0px"
  cardRadius: "0px"
  imageRadius: "0px"
  shadowStyle: "none"
  borderStyle: "thin crimson rules"

tone:
  overall: "editorial, confident, minimal"
  colorMode: "light"
  contrast: "high"
  imagery: "small floating photo tiles, cropped and offset"
  heroStyle: "centered-overlay"   # large centered serif headline, floating image tiles, side news slider
  cardStyle: "flat"               # solid color blocks, square corners
  navStyle: "minimal"             # logo, search, hamburger

cssVariables: |
