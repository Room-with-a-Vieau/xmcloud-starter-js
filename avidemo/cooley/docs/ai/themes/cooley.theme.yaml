  method: "playwright-full"
  notes:
    - "Below-the-fold sections lazy-load and did not render in the scrape; palette taken from hero, resource cards and computed styles."
    - "GT Sectra (headings) and Arial Nova (body) are proprietary — substituted with Google Fonts Newsreader and Arimo."
    - "Lavender (#E6EAFF) and blush (#FFF2F4) sampled from the screenshot."
    - "Prospera has a single --font-family token; the serif heading font needs a small h1–h3 override in the .site-cooley block."
