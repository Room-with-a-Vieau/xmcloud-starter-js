  --brand-header-bg: #FFFFFF;
  --brand-header-fg: #FD1434;
  --brand-footer-bg: #FD1434;
  --brand-footer-fg: #33040E;
  --brand-border: #FD1434;
  --brand-ring: #FD1434;
  --brand-heading-font: 'Newsreader', Garamond, 'Times New Roman', serif;
  --brand-body-font: 'Arimo', Arial, Helvetica, sans-serif;
  --brand-radius: 0;
  --brand-button-radius: 0;
  --brand-card-radius: 0;

# Prospera token mapping (theme-component-mapping.md §2) — applied in Phase 4
prosperaTokens:
  --text-body: "#33040E"
  --text-body-inverted: "#33040E"
  --text-colored: "#FD1434"
  --text-accent: "#FD1434"
  --text-footer: "#33040E"
  --bg-body: "#FFFFFF"
  --bg-main: "#FFF2F4"
  --bg-main-alt: "#E6EAFF"
  --bg-color: "#FFF2F4"
